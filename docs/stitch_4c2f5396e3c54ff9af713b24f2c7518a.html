<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_10 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_10" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_10');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js 3D Interactive Indian Ocean Basin Digital Twin for ISRO SIH26176
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_INDIAN_OCEAN');
  if (!container) return;

  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 1000);
  camera.position.set(0, 0.5, 4.2);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  container.appendChild(renderer.domElement);

  // Group for Earth globe + telemetry layers + satellites
  const globeGroup = new THREE.Group();
  // Tilt to center India and the Indian Ocean Basin (Lat ~15°N, Lon ~78°E)
  globeGroup.rotation.x = 0.35;
  globeGroup.rotation.y = -1.82;
  scene.add(globeGroup);

  // Procedural Canvas Texture for Globe Surface:
  // Indian Ocean, Arabian Sea, Bay of Bengal, Indian Subcontinent coastline, Lakshadweep, Andaman & Nicobar
  const canvas = document.createElement('canvas');
  canvas.width = 4096;
  canvas.height = 2048;
  const ctx = canvas.getContext('2d');

  // Midnight abyss navy base (#071D29)
  ctx.fillStyle = '#061722';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Bathymetric Depth Gradients in the Indian Ocean Basin
  const oceanGrad = ctx.createRadialGradient(
    canvas.width * 0.71, canvas.height * 0.54, 50,
    canvas.width * 0.71, canvas.height * 0.54, 850
  );
  oceanGrad.addColorStop(0, '#0f3241');
  oceanGrad.addColorStop(0.35, '#0a232f');
  oceanGrad.addColorStop(0.7, '#071b26');
  oceanGrad.addColorStop(1, '#05131b');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle Navigational & Bathymetric Grid Lines
  ctx.strokeStyle = 'rgba(0, 212, 255, 0.08)';
  ctx.lineWidth = 1.2;
  for (let lat = 0; lat < canvas.height; lat += 128) {
    ctx.beginPath();
    ctx.moveTo(0, lat);
    ctx.lineTo(canvas.width, lat);
    ctx.stroke();
  }
  for (let lon = 0; lon < canvas.width; lon += 128) {
    ctx.beginPath();
    ctx.moveTo(lon, 0);
    ctx.lineTo(lon, canvas.height);
    ctx.stroke();
  }

  // Draw land polygon helper
  function drawLand(points, fillColor, strokeColor) {
    if (!points.length) return;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i][0], points[i][1]);
    }
    ctx.closePath();
    ctx.fillStyle = fillColor || '#102733';
    ctx.fill();
    ctx.strokeStyle = strokeColor || '#00d4ff44';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // 1. Indian Subcontinent (Center Stage: Lon ~68°E to 89°E, Lat ~8°N to 36°N)
  // Scaled coordinates on 4096x2048:
  // Lon: (lon + 180)/360 * 4096. Lon 78°E = 2935.
  // Lat: (90 - lat)/180 * 2048. Lat 20°N = 796.
  const indiaPolygon = [
    [2820, 630], [2860, 610], [2940, 620], [2990, 680], [3040, 710], // North / Himalaya base
    [3030, 780], [2990, 830], [2980, 890], // Bengal / Odisha coast
    [2950, 950], [2920, 1010], [2890, 1070], // Andhra / Tamil Nadu coast (Chennai)
    [2865, 1105], // Kanyakumari / Cape Comorin tip
    [2850, 1070], [2835, 1000], [2810, 930], // Malabar coast / Kerala / Goa / Maharashtra
    [2790, 870], [2760, 820], // Gujarat / Saurashtra peninsula
    [2740, 800], [2750, 760], [2780, 740], [2800, 680]
  ];
  drawLand(indiaPolygon, '#0d222e', '#00d4ff88');

  // Sri Lanka
  const sriLanka = [
    [2895, 1120], [2915, 1130], [2910, 1165], [2890, 1155]
  ];
  drawLand(sriLanka, '#0e2634', '#00d4ff99');

  // Arabian Peninsula / Middle East Coastline
  const arabia = [
    [2580, 700], [2660, 710], [2710, 750], [2680, 850],
    [2620, 900], [2570, 870], [2520, 790]
  ];
  drawLand(arabia, '#0b1d28', '#00d4ff33');

  // Horn of Africa & East African Coastline
  const africaEast = [
    [2520, 900], [2580, 920], [2610, 1010], [2600, 1120],
    [2550, 1260], [2490, 1370], [2440, 1420], [2400, 1360],
    [2430, 1150], [2470, 990]
  ];
  drawLand(africaEast, '#0a1922', '#00d4ff25');

  // Madagascar
  drawLand([[2620, 1280], [2650, 1310], [2630, 1400], [2600, 1370]], '#0a1922', '#00d4ff33');

  // Southeast Asia / Bay of Bengal Eastern Rim (Myanmar, Thailand, Malacca)
  const seAsia = [
    [3070, 760], [3120, 790], [3160, 870], [3150, 980],
    [3130, 1080], [3090, 1070], [3070, 970], [3040, 880]
  ];
  drawLand(seAsia, '#0c202a', '#00d4ff40');

  // Sumatra & Indonesian Archipelago
  drawLand([[3120, 1100], [3180, 1140], [3270, 1180], [3240, 1220], [3140, 1160]], '#0c202a', '#00d4ff40');

  // Lakshadweep Atoll Archipelago (Glowing dots & reefs west of Kerala)
  const lakshadweepIslands = [
    [2825, 1025], [2828, 1045], [2832, 1065], [2830, 1085]
  ];
  lakshadweepIslands.forEach(pt => {
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(pt[0], pt[1], 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // Andaman & Nicobar Archipelago (Arc in the eastern Bay of Bengal)
  const andamanNicobar = [
    [3055, 960], [3058, 985], [3062, 1010], [3065, 1035], [3070, 1060], [3075, 1090]
  ];
  andamanNicobar.forEach(pt => {
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(pt[0], pt[1], 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // Bathymetric Mid-Ocean Ridges (Ninety East Ridge, Central Indian Ridge, Carlsberg Ridge)
  ctx.strokeStyle = 'rgba(0, 212, 255, 0.35)';
  ctx.setLineDash([8, 12]);
  ctx.lineWidth = 2.5;

  // Ninety East Ridge
  ctx.beginPath();
  ctx.moveTo(3000, 920);
  ctx.bezierCurveTo(3020, 1120, 3040, 1380, 3030, 1540);
  ctx.stroke();

  // Central Indian Ridge
  ctx.beginPath();
  ctx.moveTo(2740, 960);
  ctx.bezierCurveTo(2810, 1180, 2850, 1370, 2800, 1580);
  ctx.stroke();

  // Carlsberg Ridge (Arabian Sea to Central Indian Ridge)
  ctx.beginPath();
  ctx.moveTo(2680, 870);
  ctx.bezierCurveTo(2710, 920, 2760, 980, 2790, 1060);
  ctx.stroke();
  ctx.setLineDash([]);

  // Major Indian Coastal Ports & Scientific Mooring Stations
  const ports = [
    { name: 'MUMBAI', x: 2795, y: 885, code: 'IN-BOM' },
    { name: 'KOCHI', x: 2845, y: 1065, code: 'IN-COK' },
    { name: 'CHENNAI', x: 2920, y: 1010, code: 'IN-MAA' },
    { name: 'VIZAG', x: 2955, y: 925, code: 'IN-VTZ' },
    { name: 'PORT BLAIR', x: 3060, y: 995, code: 'IN-IXZ' },
    { name: 'KAVARATTI', x: 2828, y: 1045, code: 'IN-KVT' },
    { name: 'EQUATORIAL BUOY-04', x: 2900, y: 1240, code: 'INCOIS-EQ4' }
  ];

  ports.forEach(port => {
    // Concentric glowing observation beacon
    ctx.fillStyle = '#00d4ff';
    ctx.beginPath();
    ctx.arc(port.x, port.y, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(port.x, port.y, 16, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#F1EFE8';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(port.name, port.x + 22, port.y + 6);

    ctx.fillStyle = '#00d4ff';
    ctx.font = '14px monospace';
    ctx.fillText(port.code, port.x + 22, port.y + 22);
  });

  // Sea Surface Current Vectors (Bay of Bengal Gyre & Somali Current)
  ctx.strokeStyle = 'rgba(212, 231, 226, 0.28)';
  ctx.lineWidth = 1.8;
  const currentFlows = [
    // Bay of Bengal cyclonic flow
    [[2970, 900], [2990, 950], [2970, 1030], [2920, 1050]],
    [[3020, 850], [3040, 930], [3020, 1020], [2960, 1070]],
    // Arabian Sea West India Coastal Current
    [[2800, 830], [2820, 930], [2840, 1030], [2870, 1120]]
  ];
  currentFlows.forEach(curve => {
    ctx.beginPath();
    ctx.moveTo(curve[0][0], curve[0][1]);
    for (let i = 1; i < curve.length; i++) {
      ctx.lineTo(curve[i][0], curve[i][1]);
    }
    ctx.stroke();
  });

  const earthTexture = new THREE.CanvasTexture(canvas);
  earthTexture.anisotropy = 8;

  // Globe Mesh
  const sphereGeo = new THREE.SphereGeometry(1.68, 64, 64);
  const sphereMat = new THREE.MeshStandardMaterial({
    map: earthTexture,
    roughness: 0.82,
    metalness: 0.12,
    bumpScale: 0.04
  });
  const earthMesh = new THREE.Mesh(sphereGeo, sphereMat);
  globeGroup.add(earthMesh);

  // Atmospheric Halo Layer (Restrained Electric Cyan & Sea Glass Fresnel)
  const atmosGeo = new THREE.SphereGeometry(1.725, 48, 48);
  const atmosMat = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        vec3 viewDir = normalize(-vPosition);
        float edge = dot(viewDir, vNormal);
        float intensity = pow(1.0 - abs(edge), 2.7) * 0.85;
        // Cyan-teal luminous atmosphere
        vec3 atmosColor = vec3(0.0, 0.83, 1.0);
        gl_FragColor = vec4(atmosColor, intensity);
      }
    `,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false
  });
  const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
  globeGroup.add(atmosMesh);

  // ISRO Satellite Orbit Trajectories (Oceansat-3 / EOS-06 & GISAT-1 orbital rings)
  // Orbit 1: Polar Sun-Synchronous (Oceansat-3 / EOS-06)
  const orbitCurve1 = new THREE.EllipseCurve(0, 0, 2.05, 2.05, 0, 2 * Math.PI, false, 0);
  const points1 = orbitCurve1.getPoints(120);
  const orbitGeo1 = new THREE.BufferGeometry().setFromPoints(points1.map(p => new THREE.Vector3(p.x, 0, p.y)));
  const orbitMat1 = new THREE.LineBasicMaterial({
    color: 0x00d4ff,
    transparent: true,
    opacity: 0.45
  });
  const orbitMesh1 = new THREE.Line(orbitGeo1, orbitMat1);
  orbitMesh1.rotation.x = Math.PI / 2.35;
  orbitMesh1.rotation.z = Math.PI / 4.5;
  globeGroup.add(orbitMesh1);

  // Satellite Mesh on Orbit 1
  const satGeo = new THREE.BoxGeometry(0.04, 0.02, 0.03);
  const satMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
  const satMesh1 = new THREE.Mesh(satGeo, satMat);
  globeGroup.add(satMesh1);

  // Orbit 2: Geostationary / Inclined Telemetry Track (INSAT-3DR / SARAL-AltiKa)
  const orbitCurve2 = new THREE.EllipseCurve(0, 0, 2.32, 2.32, 0, 2 * Math.PI, false, 0);
  const points2 = orbitCurve2.getPoints(140);
  const orbitGeo2 = new THREE.BufferGeometry().setFromPoints(points2.map(p => new THREE.Vector3(p.x, 0, p.y)));
  const orbitMat2 = new THREE.LineDashedMaterial({
    color: 0xe6a448, // Alert amber telemetry
    dashSize: 0.08,
    gapSize: 0.04,
    transparent: true,
    opacity: 0.55
  });
  const orbitMesh2 = new THREE.Line(orbitGeo2, orbitMat2);
  orbitMesh2.computeLineDistances();
  orbitMesh2.rotation.x = Math.PI / 1.85;
  orbitMesh2.rotation.y = -Math.PI / 6.2;
  globeGroup.add(orbitMesh2);

  const satMesh2 = new THREE.Mesh(
    new THREE.SphereGeometry(0.024, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xe6a448 })
  );
  globeGroup.add(satMesh2);

  // Floating Bathymetric Sounding Particle Cloud (Deep Ocean Acoustic & Buoy Nodes)
  const pCount = 320;
  const pPositions = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount; i++) {
    const phi = Math.acos(-1 + (2 * i) / pCount);
    const theta = Math.sqrt(pCount * Math.PI) * phi;
    const r = 1.76 + Math.random() * 0.35;
    pPositions[i * 3] = r * Math.cos(theta) * Math.sin(phi);
    pPositions[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
    pPositions[i * 3 + 2] = r * Math.cos(phi);
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  const pMat = new THREE.PointsMaterial({
    color: 0x00d4ff,
    size: 0.022,
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending
  });
  const pSystem = new THREE.Points(pGeo, pMat);
  globeGroup.add(pSystem);

  // Cinematic Lighting
  // Key Sunlight hitting northern Indian ocean basin
  const keyLight = new THREE.DirectionalLight(0xd4e7e2, 1.85);
  keyLight.position.set(4, 3.5, 4);
  scene.add(keyLight);

  // Deep oceanic abyss ambient
  const ambientLight = new THREE.AmbientLight(0x071d29, 0.95);
  scene.add(ambientLight);

  // Electric cyan edge rim light
  const rimLight = new THREE.DirectionalLight(0x00d4ff, 1.3);
  rimLight.position.set(-4.5, -2, -3.5);
  scene.add(rimLight);

  // Parallax interaction & Drag-to-rotate handling
  let mouseX = 0;
  let mouseY = 0;
  let targetX = 0;
  let targetY = 0;
  let isDragging = false;
  let prevMouseX = 0;
  let prevMouseY = 0;

  function onMouseMove(e) {
    const rect = container.getBoundingClientRect();
    const currX = ((e.clientX - rect.left) / width) * 2 - 1;
    const currY = -(((e.clientY - rect.top) / height) * 2 - 1);

    if (isDragging) {
      const deltaX = e.clientX - prevMouseX;
      const deltaY = e.clientY - prevMouseY;
      globeGroup.rotation.y += deltaX * 0.005;
      globeGroup.rotation.x += deltaY * 0.005;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    } else {
      mouseX = currX;
      mouseY = currY;
    }
  }

  function onMouseDown(e) {
    if (e.target.tagName.toLowerCase() === 'canvas') {
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    }
  }

  function onMouseUp() {
    isDragging = false;
  }

  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mouseup', onMouseUp);

  // Resize handler
  function onResize() {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);

  // Animation Loop
  let clock = new THREE.Clock();
  let satAngle1 = 0;
  let satAngle2 = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    // Subtle drift rotation focused on the Indian Ocean
    if (!isDragging) {
      globeGroup.rotation.y += 0.0009;
    }

    // Parallax sway
    targetX += (mouseX * 0.12 - targetX) * 0.035;
    targetY += (mouseY * 0.12 - targetY) * 0.035;
    camera.position.x = targetX * 0.6;
    camera.position.y = 0.5 + targetY * 0.4;
    camera.lookAt(0, 0, 0);

    // Orbiting Satellites position updates
    satAngle1 += dt * 0.65;
    const r1 = 2.05;
    satMesh1.position.set(
      Math.cos(satAngle1) * r1,
      Math.sin(satAngle1) * 0.4,
      Math.sin(satAngle1) * r1
    );

    satAngle2 += dt * 0.42;
    const r2 = 2.32;
    satMesh2.position.set(
      Math.sin(satAngle2) * r2,
      Math.cos(satAngle2) * 0.6,
      Math.cos(satAngle2) * r2
    );

    renderer.render(scene, camera);
  }
  animate();

  // Cleanup
  const observer = new MutationObserver(() => {
    if (!document.contains(container)) {
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mousedown', onMouseDown);
      window.removeEventListener('mouseup', onMouseUp);
      window.removeEventListener('resize', onResize);
      observer.disconnect();
      renderer.dispose();
      sphereGeo.dispose();
      sphereMat.dispose();
      atmosGeo.dispose();
      atmosMat.dispose();
      earthTexture.dispose();
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_10 -->
</body>
</html>
